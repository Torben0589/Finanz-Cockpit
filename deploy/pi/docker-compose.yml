version: "3.9"

# =====================================================================
# Raspberry Pi 5 — Production Deployment (GitOps "pull-only" mode)
#
# This file is what actually runs on your Pi. It NEVER builds the image
# locally — it only pulls the pre-built multi-arch image that GitHub
# Actions published to GHCR (see .github/workflows/build-and-push.yml).
# This keeps the Pi's limited 4 GB RAM free for running the app instead
# of compiling Next.js.
#
# Everything sensitive lives ONLY on this machine:
#   - ./data/finance.db        (SQLite database, never in git)
#   - ./.env                   (real secrets, copy from .env.pi.example)
#
# Usage:
#   1. cd deploy/pi
#   2. cp .env.pi.example .env   # then edit with your own SESSION_SECRET
#   3. docker compose pull
#   4. docker compose up -d
#
# Update to a new version later:
#   docker compose pull && docker compose up -d
#   (Prisma migrations run automatically on container start, see Dockerfile CMD)
# =====================================================================

services:
  finance-cockpit:
    image: ghcr.io/torben0589/finanz-cockpit:latest   # <-- replace OWNER/REPO with your GitHub repo path
    container_name: finance-cockpit
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env   # NEVER committed — copy from .env.pi.example locally
    environment:
      DATABASE_URL: "file:/data/finance.db"
      NODE_ENV: "production"
    volumes:
      # Local-first: the actual database file lives only on this Pi
      # (or point this at your Fritz!NAS SMB/WebDAV mount instead, e.g.
      # /mnt/fritznas/finance:/data)
      - ./data:/data
    mem_limit: 512m
    cpus: "1.5"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/auth/session"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      # Opt-in to Watchtower auto-updates (see service below). Safe here
      # because Prisma migrations run automatically on every container
      # start (Dockerfile CMD), so a pulled update never leaves the DB
      # schema out of sync. Set to "false" if you prefer manual updates.
      - "com.centurylinklabs.watchtower.enable=true"

  # Automatic updates when a new image lands in GHCR (nightly check).
  # Remove this service entirely if you prefer fully manual
  # `docker compose pull && docker compose up -d`.
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"   # nightly at 04:00
    command: --label-enable
    labels:
      - "com.centurylinklabs.watchtower.enable=false"  # watchtower doesn't update itself

  # Re-enable auto-update for the app only by adding this label to the
  # finance-cockpit service above:
  #   labels:
  #     - "com.centurylinklabs.watchtower.enable=true"
